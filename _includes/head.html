<meta charset="utf-8">

{% include seo.html %}

{% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers. The ?v= changes on every build: GitHub Pages lets
     browsers cache CSS for ten minutes, and a returning visitor could
     otherwise get fresh HTML styled by the previous deploy's stylesheet. -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<meta http-equiv="cleartype" content="on">
