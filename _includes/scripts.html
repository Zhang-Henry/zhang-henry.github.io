<script>
// Open external links in a new tab (replaces the old base-target=_blank tag,
// which also hijacked in-site navigation links and spawned new tabs)
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (a.hostname && a.hostname !== location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
});

// Recalculate greedy-nav once fonts/layout are final, so the hamburger
// button doesn't get stuck overlapping the menu items
function recalcNav() {
  if (typeof updateNav === 'function') { updateNav(); }
}
window.addEventListener('load', recalcNav);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(recalcNav);
}

function toggleLang() {
  var html = document.documentElement;
  if (html.classList.contains('zh')) {
    html.classList.remove('zh');
    localStorage.setItem('lang', 'en');
  } else {
    html.classList.add('zh');
    localStorage.setItem('lang', 'zh');
  }
  // Trigger greedy-nav recalculation
  window.dispatchEvent(new Event('resize'));
}
</script>

<script>
/* --------------------------------------------------------------------------
   Colour theme
   -------------------------------------------------------------------------- */
function toggleTheme() {
  var root = document.documentElement;
  var isDark = root.classList.toggle('dark');
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
}

/* --------------------------------------------------------------------------
   Reading progress, scrollspy, back-to-top
   -------------------------------------------------------------------------- */
(function () {
  var progress = document.getElementById('scroll-progress');
  var masthead = document.querySelector('.masthead');
  var navLinks = [].slice.call(document.querySelectorAll('#site-nav a[href*="#"]'));
  var targets = navLinks.map(function (a) {
    var id = a.getAttribute('href').split('#')[1];
    return id ? document.getElementById(id) : null;
  });

  var toTop = document.createElement('button');
  toTop.className = 'to-top';
  toTop.type = 'button';
  toTop.setAttribute('aria-label', 'Back to top');
  toTop.innerHTML = '<i class="fas fa-arrow-up" aria-hidden="true"></i>';
  toTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.body.appendChild(toTop);

  var ticking = false;
  function onScroll() {
    if (ticking) { return; }
    ticking = true;
    window.requestAnimationFrame(function () {
      var doc = document.documentElement;
      var max = doc.scrollHeight - doc.clientHeight;
      var y = window.pageYOffset || doc.scrollTop;

      if (progress) {
        progress.style.transform = 'scaleX(' + (max > 0 ? y / max : 0) + ')';
      }
      toTop.classList.toggle('is-visible', y > 420);
      if (masthead) { masthead.classList.toggle('is-stuck', y > 8); }

      var activeIndex = -1;
      for (var i = 0; i < targets.length; i++) {
        var el = targets[i];
        if (el && el.getBoundingClientRect().top <= 120) { activeIndex = i; }
      }
      navLinks.forEach(function (a, i) {
        var li = a.parentNode;
        if (li && li.classList) { li.classList.toggle('is-active', i === activeIndex); }
      });

      ticking = false;
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();
})();

</script>

<script>
/* --------------------------------------------------------------------------
   Sidebar email: copy to the clipboard instead of firing up a mail client
   -------------------------------------------------------------------------- */
(function () {
  var link = document.querySelector('.author__email');
  if (!link) { return; }

  var address = link.getAttribute('data-email') ||
                link.getAttribute('href').replace(/^mailto:/, '');
  var label = link.querySelector('.author__email-text');
  if (!label) { return; }

  var original = label.innerHTML;
  var timer;

  function flash(message) {
    clearTimeout(timer);
    label.textContent = message;
    link.classList.add('is-copied');
    timer = setTimeout(function () {
      label.innerHTML = original;
      link.classList.remove('is-copied');
    }, 1600);
  }

  // Works without a secure context, and covers the case where the Clipboard
  // API exists but the permission is refused.
  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var box = document.createElement('textarea');
      box.value = text;
      box.setAttribute('readonly', '');
      box.style.position = 'fixed';
      box.style.top = '-1000px';
      document.body.appendChild(box);
      box.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(box);
      ok ? resolve() : reject();
    });
  }

  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () {
        return legacyCopy(text);
      });
    }
    return legacyCopy(text);
  }

  // Last resort: the label only says "Email", so swap the address itself in
  // and select it, and Cmd/Ctrl+C just works. No message on top of it —
  // writing one into the label would wipe out the selection.
  function revealAddress() {
    clearTimeout(timer);
    link.classList.remove('is-copied');
    label.textContent = address;
    try {
      var range = document.createRange();
      range.selectNodeContents(label);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) { /* the address is on screen either way */ }
    timer = setTimeout(function () { label.innerHTML = original; }, 8000);
  }

  link.addEventListener('click', function (event) {
    // Let people who actually want their mail client through with a modifier
    if (event.metaKey || event.ctrlKey || event.shiftKey) { return; }
    event.preventDefault();
    var zh = document.documentElement.classList.contains('zh');
    copy(address).then(function () {
      flash(zh ? '已复制' : 'Copied!');
    }).catch(revealAddress);
  });
})();
</script>

<script>
/* --------------------------------------------------------------------------
   Publication abstract panels
   -------------------------------------------------------------------------- */
(function () {
  var buttons = [].slice.call(document.querySelectorAll('.pub-meta-btn'));
  if (!buttons.length) { return; }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var panel = document.getElementById(btn.getAttribute('data-panel'));
      if (!panel) { return; }
      var open = btn.getAttribute('aria-expanded') === 'true';

      // One panel at a time within a paper, so the row does not grow twice over
      var row = btn.closest('.pub-link-row');
      if (row && !open) {
        [].forEach.call(row.querySelectorAll('.pub-meta-btn'), function (other) {
          if (other === btn) { return; }
          other.setAttribute('aria-expanded', 'false');
          var p = document.getElementById(other.getAttribute('data-panel'));
          if (p) { p.hidden = true; }
        });
      }

      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.hidden = open;
    });
  });

})();
</script>
