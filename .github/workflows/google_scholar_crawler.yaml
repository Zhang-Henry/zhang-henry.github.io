name: Get Citation Data

on:
 workflow_dispatch:
 page_build:
 schedule:
  - cron:  '0 17 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    # The proxy lookup can stall; fail in minutes instead of burning the
    # 6-hour default and showing up as "cancelled".
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    # requirements.txt is resolved for Python 3.12, so pin the interpreter
    # rather than inheriting whatever ubuntu-latest ships that month.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip install -r requirements.txt
        python main.py
        if [ -d "./results" ]; then
          cd ./results
          git init
          # user.email was never set here, so on runs where git could not guess
          # one the commit aborted with "Author identity unknown" -- after the
          # fetch had already succeeded.
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        else
          echo "results directory does not exist, skipping commit and push"
        fi
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
