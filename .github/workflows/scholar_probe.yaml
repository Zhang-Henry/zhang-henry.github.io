name: Scholar Probe (temporary)

# Answers one question: will Google Scholar serve a direct request from a
# GitHub-hosted runner, with no proxy? The scholarly crawler has always gone
# through FreeProxies, so this is untested. Manual only, and it writes nothing
# anywhere -- the real crawler is untouched while this runs.
#
# Delete this workflow once the question is settled.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Probe Scholar directly
      run: python3 google_scholar_crawler/fetch_stdlib.py --probe
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
