{%- comment -%}
Behaviour for the visitor map. It lives here rather than in scripts.html
so that the map's markup and its code travel together: a page that does
not include visitor-map.html does not ship this either.
{%- endcomment -%}
<script>
/* --------------------------------------------------------------------------
   Visitor map (see _includes/visitor-map.html for the why)
   -------------------------------------------------------------------------- */

  var root = document.getElementById('visitor-map');
  if (!root) { return; }

  var NS       = root.getAttribute('data-namespace');

  /* The basemap SVG is viewBox="0 70 1000 400" over a 1000x500 plate carree,
     so a point has to be shifted and rescaled into that window. */
  function toPercent(lon, lat) {
    var x = (lon + 180) / 360 * 1000;
    var y = (90 - lat) / 180 * 500;
    var pct = (y - 70) / 400 * 100;
    /* The basemap is cropped at roughly 64.8N / 79.2S, so Iceland and the
       Nordics would otherwise render above the top edge and vanish. Pin them
       to the rim instead of dropping them. */
    return { x: x / 1000 * 100, y: Math.min(98, Math.max(1.6, pct)) };
  }

  /* Abacus answers 404 for a key that has never been written, which is not an
     error here — it just means nobody from there has visited yet. */
  function jsonGet(url) {
    return fetch(url, { mode: 'cors' }).then(function (r) {
      if (r.status === 404) { return { value: 0 }; }
      if (!r.ok) { throw new Error(r.status); }
      return r.json();
    });
  }

  function country() {
    return fetch(GEO).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/^loc=([A-Z]{2})$/m);
      return m ? m[1] : null;
    }).catch(function () { return null; });
  }

  /* One count per visitor per day, so a reload does not inflate the total. */
  function alreadyCounted() {
    try {
      var today = new Date().toISOString().slice(0, 10);
      if (localStorage.getItem('vmap-day') === today) { return true; }
      localStorage.setItem('vmap-day', today);
      return false;
    } catch (e) { return false; }
  }

  function cached(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }

  function store(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  }

  function paint(counts) {
    var box = document.getElementById('visitor-map-dots');
    if (!box) { return; }
    var max = 1;
    Object.keys(counts).forEach(function (c) { if (counts[c] > max) { max = counts[c]; } });

    box.innerHTML = '';
    Object.keys(counts).forEach(function (code) {
      var n = counts[code];
      var place = PLACES[code];
      if (!n || !place) { return; }
      var p = toPercent(place[0], place[1]);
      var size = 5 + 11 * Math.sqrt(n / max);
      var dot = document.createElement('span');
      dot.className = 'visitor-map__dot';
      dot.style.left = p.x + '%';
      dot.style.top = p.y + '%';
      dot.style.width = dot.style.height = size.toFixed(1) + 'px';
      dot.title = code + ': ' + n;
      box.appendChild(dot);
    });
  }

  function showTotal(n) {
    var el = document.getElementById('visitor-map-count');
    if (!el) { return; }
    var v = Number(n);
    el.textContent = isFinite(v) ? v.toLocaleString('en-US') : '\u2014';
  }

  /* Abacus rate-limits bursts (429 after roughly 30 rapid calls), so the
     country tallies are refreshed a few per visit, spaced out, and merged
     into a cache that persists between visits. The map therefore fills in
     progressively instead of demanding one request per country up front. */
  var BATCH = 6, SPACING = 260;

  function refreshCountries(mine) {
    var store_key = 'vmap-counts', cursor_key = 'vmap-cursor';
    var counts = cached(store_key) || {};
    if (mine) { counts[mine] = Math.max(counts[mine] || 0, 1); }
    paint(counts);

    var codes = Object.keys(PLACES);
    var start = 0;
    try { start = parseInt(localStorage.getItem(cursor_key) || '0', 10) || 0; } catch (e) {}
    var slice = [];
    for (var i = 0; i < BATCH; i++) { slice.push(codes[(start + i) % codes.length]); }
    try { localStorage.setItem(cursor_key, String((start + BATCH) % codes.length)); } catch (e) {}

    slice.forEach(function (code, i) {
      setTimeout(function () {
        jsonGet(API + '/get/' + NS + '/c-' + code).then(function (r) {
          if (r.value > 0) { counts[code] = r.value; } else { delete counts[code]; }
          if (mine) { counts[mine] = Math.max(counts[mine] || 0, 1); }
          store(store_key, counts);
          paint(counts);
        }).catch(function () {});
      }, i * SPACING);
    });
  }

  /* Own backend: one request returns the total and every country, so there is
     no rate limit to work around and no third-party geolocation call. */
  if (ENDPOINT) {
    var counted = !alreadyCounted();
    jsonGet(ENDPOINT + (counted ? '?count=1' : ''))
      .then(function (data) {
        showTotal(data.total);
        paint(data.countries || {});
      })
      .catch(function () { showTotal(null); });
    return;
  }

  country().then(function (code) {
    var fresh = !alreadyCounted();

    /* One request at a time: a burst is what trips the rate limiter. */
    jsonGet(API + (fresh ? '/hit/' : '/get/') + NS + '/total')
      .then(function (r) { showTotal(r.value); })
      .catch(function () { showTotal(null); })
      .then(function () {
        if (fresh && code) {
          return jsonGet(API + '/hit/' + NS + '/c-' + code).catch(function () {});
        }
      })
      .then(function () {
        setTimeout(function () { refreshCountries(code); }, 400);
      });
  });
})();
</script>
